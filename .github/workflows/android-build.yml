
name: YORU Client Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract YORU source
        run: |
          mkdir -p "$RUNNER_TEMP/yoru-src"
          unzip -q "YORU-Client-Stage260(1).zip" -d "$RUNNER_TEMP/yoru-src"

          PROJECT_DIR=$(find "$RUNNER_TEMP/yoru-src" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle settings file not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app module not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure AndroidX
        run: |
          touch "$PROJECT_DIR/gradle.properties"
          if grep -q '^android.useAndroidX=' "$PROJECT_DIR/gradle.properties"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROJECT_DIR/gradle.properties"
          else
            echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          fi

      - name: Align Kotlin JVM target with Java
        run: |
          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          else
            cat >> "$PROJECT_DIR/app/build.gradle" <<'EOF'

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }
          EOF
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

          mkdir -p build-output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            build-output/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YORU-Client-Debug-APK
          path: build-output/app-debug.apk
          if-no-files-found: error
          retention-days: 14
